<svg width="350" height="100" viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: The Horizon Envelope -->
  <g transform="translate(20, 25)">
    <!-- Rounded Background (App Icon Base) -->
    <rect width="100" height="100" rx="22" fill="#6366F1" />
    
    <!-- Horizon Line -->
    <line x1="0" y1="62" x2="100" y2="62" stroke="white" stroke-width="2" stroke-opacity="0.3" />
    
    <!-- Modern Envelope Flap (The "V") -->
    <path d="M25 42 L50 62 L75 42" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Forward Motion Indicator (Subtle Arrow at Horizon) -->
    <path d="M78 62 L90 62 L86 58 M90 62 L86 66" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Wordmark: Modern Geometric Sans-Serif -->
  <text x="145" y="92" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1">
    <tspan fill="#6366F1">Yonder</tspan>
    <tspan fill="#0F172A" font-weight="500">Mail</tspan>
  </text>
</svg>